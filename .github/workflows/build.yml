name: Build LightingLuminol

on:
  push:
    branches: ['*']
  pull_request:
    branches: ['*']

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global core.autocrlf false
          git config --global core.longpaths true

      # applyAllPatches sets up the Paper environment (paper-server classpath),
      # but also overwrites src/minecraft/java with decompiled sources.
      # We must restore our committed source modifications before building.
      - name: Apply Patches
        run: .\gradlew.bat applyAllPatches

      - name: Restore committed source modifications
        run: git checkout -- lightingluminol-server/src/minecraft/java/

      - name: Build Paperclip JAR
        run: .\gradlew.bat createPaperclipJar

      - name: Upload JAR Artifact
        uses: actions/upload-artifact@v4
        with:
          name: lightingluminol-paperclip
          path: lightingluminol-server/build/libs/*.jar
