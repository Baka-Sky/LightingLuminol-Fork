name: Build LightingLuminol

on:
  push:
    branches: ['*']
  pull_request:
    branches: ['*']

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global core.autocrlf false
          git config --global core.longpaths true

      # Note: src/minecraft contains committed source modifications.
      # Running applyAllPatches here would regenerate them from decompiled
      # sources and overwrite those modifications (e.g. RegionFile -> IRegionFile,
      # EntityFluidInteraction ChunkStatus.SPAWN). Build directly instead.
      - name: Build Paperclip JAR
        run: .\gradlew.bat createPaperclipJar

      - name: Upload JAR Artifact
        uses: actions/upload-artifact@v4
        with:
          name: lightingluminol-paperclip
          path: lightingluminol-server/build/libs/*.jar
